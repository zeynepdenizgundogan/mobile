<ion-header class="custom-header" translucent="false">
  <ion-toolbar class="custom-toolbar">
    <ion-title class="title-container">My Route Plan</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content fullscreen="true" class="trip-plan-content">
  <div *ngIf="mapLoadError" class="error-message">
    <ion-text color="danger">
      <p style="text-align:center; margin: 1rem;">Google Maps yüklenemedi. Lütfen internet bağlantınızı kontrol edin.</p>
    </ion-text>
  </div>

  <ion-segment *ngIf="routes.length > 0" scrollable [value]="selectedDayIndex.toString()" (ionChange)="onSegmentChange($event)">
    <ion-segment-button *ngFor="let day of routes; let i = index" [value]="i.toString()">
      <ion-label>Day {{ i + 1 }}</ion-label>
    </ion-segment-button>
  </ion-segment>

  <div *ngIf="routes.length > 0 && routes[selectedDayIndex] as day" class="day-section">
    <div class="route-card" *ngFor="let place of day.route; let i = index">
      <div class="time-column">
        <span class="start-time">{{ place.visitStartTime }}</span>
        <span class="end-time">{{ place.visitEndTime }}</span>
      </div>

      <div class="card-content" [ngClass]="i % 2 === 0 ? 'card-blue' : 'card-white'">
        <div class="location-info">
          <h3>{{ place.name }}</h3>
          <p>{{ place.category }}</p>
        </div>
        <button ion-button fill="clear" class="view-map-btn">
          <ion-icon name="location-outline"></ion-icon> View in Map
        </button>
        <div class="route-number">
          <span>{{ i + 1 }}</span>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!mapLoadError" id="map"></div>

  <div *ngIf="routes.length === 0" class="no-route-message">
    <ion-text color="medium">
      <p style="text-align:center; margin-top: 2rem;">No route data found. Please go back and create a route.</p>
    </ion-text>
  </div>
</ion-content>

<ion-footer class="action-footer">
  <div class="button-container">
    <button ion-button class="full-btn edit-btn" (click)="goBack()">
      Edit Your Preferences
    </button>
    <button ion-button class="full-btn confirm-btn" (click)="goToHome()">
      Confirm and Save
    </button>
  </div>
</ion-footer>
