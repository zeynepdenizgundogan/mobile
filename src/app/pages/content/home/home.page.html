<ion-content>
  <!-- Header -->
  <div class="header">
    <div class="location-badge">
      <ion-icon name="location-outline"></ion-icon>
      <span>{{ locationCity + ', ' + locationCountry || 'Location not set' }}</span>
    </div>
    <ion-avatar>
      <img [src]="user?.photoURL || 'assets/default-avatar.png'" alt="Profile Picture">
    </ion-avatar>
  </div>

  <!-- Main Content -->
  <div class="main-container">
    <!-- Welcome Section -->
    <div class="welcome-section">
      <h2>Hi, {{ user?.displayName.split(' ')[0] || 'Guest' }}</h2>
      <h1>Where do<br>you want to go?</h1>
    </div>

    <!-- Search Bar -->
    <div class="search-wrapper">
      <div class="search-container">
        <ion-icon name="search-outline" class="search-icon"></ion-icon>
        <input type="text" placeholder="Search" class="search-input">
      </div>
    </div>

    <!-- Itineraries Grid -->
    <ion-grid>
      <ion-row>
        <ion-col size="6" *ngFor="let route of sharedRoutes">
          <ion-card class="itinerary-card" (click)="goToRouteDetail(route)">
            <div class="card-image-container">
              <img [src]="route.image_url || 'assets/images/placeholder.jpg'" (click)="goToRouteDetail(route)" />
            </div>
            <ion-card-content>
              <h3>{{ route.title || 'Unnamed Trip' }}</h3>
              <div class="card-footer">
                <div class="location-info">
                  <ion-icon name="location-outline"></ion-icon>
                  <span>{{ route.startPlace?.name || 'Unknown' }}</span>
                </div>
              </div>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

</ion-content>
